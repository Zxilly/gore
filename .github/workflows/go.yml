name: Build and tests

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  build_and_tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          check-latest: true
          go-version: "1.27.0"

      - name: Build
        run: go build -o a

      - name: Test
        shell: bash
        run: go test -timeout 1800s -v -race -coverprofile=coverage.txt -covermode=atomic -tags slow_test

      - name: Test BSD Version
        shell: bash
        run: go test -timeout 1800s -v -race -tags=slow_test,gore_bsd

      - name: Upload coverage
        uses: codecov/codecov-action@v3
